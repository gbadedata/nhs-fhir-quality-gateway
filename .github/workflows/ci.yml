name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (including pinned counts on the real ODS snapshot)
        run: python -m unittest discover -s tests -v
      - name: ODS audit and UK Core mapping
        run: python -m ods_directory --output build/ods
      - name: Synthetic Bundle through layer 2
        run: python -m fhir_gateway run --patients 90 --seed 41 --output build/synthetic
      - name: Deliberately invalid fixture is quarantined
        run: |
          python -m fhir_gateway run --input fixtures/invalid_bundle.json --output build/invalid
          python -c "import json; q=json.load(open('build/invalid/quarantine.json')); assert len(q)==4, q"

  conformance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-ukcore-2.0.2
      - name: HL7 FHIR validator (fails on any error outside the invalid fixture)
        run: conformance/run_validator.sh
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance/results/
